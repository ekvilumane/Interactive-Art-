<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Cinematic Park - Teleport</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-cursor-teleport@1.6.0/dist/aframe-cursor-teleport-component.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.4.0/dist/aframe-environment-component.min.js"></script>
  </head>

  <body>
    <a-scene cursor="rayOrigin: mouse" raycaster="objects: .clickable">
      <!-- CAMERA RIG (with smooth transition) -->
      <a-entity
        id="cameraRig"
        cursor-teleport="
          cameraRig: #cameraRig;
          cameraHead: #head;
          collisionEntities: .nav-mesh;
          transitionSpeed: 0.015
        "
      >
        <a-entity id="head" camera look-controls position="0 1.7 5"></a-entity>
      </a-entity>

      <!-- CINEMATIC ENVIRONMENT -->
      <a-entity
        environment="
          preset: forest;
          dressing: none;
          ground: hills;
          groundTexture: walkernoise;
          groundColor: #1c1f2b;
          groundColor2: #2a2f3d;

          skyType: atmosphere;
          skyColor: #0c1020;
          horizonColor: #ff9a6a;

          lighting: none;
          fog: 0.65;
        "
      >
      </a-entity>

      <!-- LIGHTING (this is where cinema actually happens) -->
      <!-- soft global tone -->
      <a-light type="ambient" intensity="0.25" color="#5a6fb0"></a-light>

      <!-- warm sunset key light -->
      <a-light
        type="directional"
        intensity="1.3"
        position="-3 6 2"
        color="#ffb07a"
      >
      </a-light>

      <!-- cool contrast fill -->
      <a-light
        type="directional"
        intensity="0.5"
        position="4 3 -3"
        color="#6a7cff"
      >
      </a-light>

      <!-- SIDEWALK (ONLY WALKABLE AREA) -->
      <a-plane
        class="nav-mesh clickable"
        rotation="-90 0 0"
        width="3"
        height="40"
        position="0 0.05 -15"
        material="color: #1a1a1a; roughness: 1"
      >
      </a-plane>

      <!-- NON-WALKABLE GROUND (visual only) -->
      <a-plane
        rotation="-90 0 0"
        width="60"
        height="60"
        position="0 0 -15"
        material="color: #10131c"
      >
      </a-plane>

      <!-- REAL TREES (not procedural embarrassment) -->
      <a-assets>
        <a-asset-item
          id="tree"
          src="https://cdn.aframe.io/test-models/models/tree/scene.gltf"
        >
        </a-asset-item>
      </a-assets>

      <a-entity
        gltf-model="#tree"
        position="-6 0 -10"
        scale="2.5 2.5 2.5"
      ></a-entity>
      <a-entity gltf-model="#tree" position="5 0 -18" scale="3 3 3"></a-entity>
      <a-entity
        gltf-model="#tree"
        position="-8 0 -22"
        scale="2.2 2.2 2.2"
      ></a-entity>
      <a-entity
        gltf-model="#tree"
        position="7 0 -26"
        scale="2.8 2.8 2.8"
      ></a-entity>

      <!-- ATMOSPHERIC LIGHT SOURCE (visual anchor) -->
      <a-entity position="0 0 -12">
        <a-cylinder height="3" radius="0.05" color="#111"></a-cylinder>

        <a-sphere
          position="0 3 0"
          radius="0.3"
          color="#ffe3b0"
          emissive="#ffcc88"
        >
        </a-sphere>

        <a-light
          type="point"
          intensity="1.8"
          distance="12"
          color="#ffdca8"
          position="0 3 0"
        >
        </a-light>
      </a-entity>
    </a-scene>
  </body>
</html>
