<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Elevator Shaft - Clean Version</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- Teleport -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-cursor-teleport@1.6.0/dist/aframe-cursor-teleport-component.min.js"></script>

    <!-- go-to -->
    <script src="js/go-to.js"></script>
  </head>

  <body>
    <a-scene cursor="rayOrigin: mouse" raycaster="objects: .clickable">
      <!-- CAMERA -->
      <a-entity
        id="cameraRig"
        cursor-teleport="
          cameraRig: #cameraRig;
          cameraHead: #head;
          collisionEntities: .nav-mesh;
          transitionSpeed: 0.01
        "
      >
        <a-entity id="head" camera look-controls position="0 1.6 5"></a-entity>
      </a-entity>

      <!-- ENVIRONMENT -->
      <a-assets>
        <a-asset-item id="keep" src="fantasy_sea_keep.glb"></a-asset-item>
      </a-assets>

      <a-entity gltf-model="#keep" position="0 0 -10" scale="2 2 2"></a-entity>

      <!-- GROUND FLOOR -->
      <a-plane
        class="nav-mesh clickable"
        rotation="-90 0 0"
        width="12"
        height="12"
        position="0 0 -10"
        color="#2f3e46"
      >
      </a-plane>

      <!-- ROOF -->
      <a-plane
        rotation="-90 0 0"
        width="10"
        height="10"
        position="0 10 -10"
        color="#3a4a52"
      >
      </a-plane>

      <!-- UP BUTTON (styled, but still valid "button") -->
      <a-cylinder
        class="clickable"
        position="2 0.5 -8"
        radius="0.7"
        height="0.2"
        color="#4CAF50"
        go-to="position: 0 10 -10"
      >
        <!-- REQUIRED nested label -->
        <a-text value="UP" align="center" position="0 0.5 0" color="white">
        </a-text>
      </a-cylinder>

      <!-- DOWN BUTTON -->
      <a-cylinder
        class="clickable"
        position="0 10.5 -10"
        radius="0.7"
        height="0.2"
        color="#e74c3c"
        go-to="position: 0 1.6 5"
      >
        <!-- REQUIRED nested label -->
        <a-text value="DOWN" align="center" position="0 0.5 0" color="white">
        </a-text>
      </a-cylinder>

      <!-- LIGHT -->
      <a-light type="ambient" intensity="0.3" color="#5c6fa3"></a-light>

      <a-light
        type="directional"
        intensity="1.2"
        position="-5 6 3"
        color="#ffb27a"
      >
      </a-light>

      <a-light
        type="directional"
        intensity="0.4"
        position="5 3 -2"
        color="#6f86ff"
      >
      </a-light>
    </a-scene>
  </body>
</html>
