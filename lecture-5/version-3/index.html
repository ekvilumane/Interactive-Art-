<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Light Church - Fixed Interior</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- Teleport -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-cursor-teleport@1.6.0/dist/aframe-cursor-teleport-component.min.js"></script>

    <!-- go-to -->
    <script src="js/go-to.js"></script>
  </head>

  <body>
    <a-scene cursor="rayOrigin: mouse" raycaster="objects: .clickable">
      <!-- CAMERA (внутри сцены) -->
      <a-entity
        id="cameraRig"
        cursor-teleport="
          cameraRig: #cameraRig;
          cameraHead: #head;
          collisionEntities: .nav-mesh;
          transitionSpeed: 0.01
        "
      >
        <a-entity id="head" camera look-controls position="0 1.6 2"></a-entity>
      </a-entity>

      <!-- MODEL (СБРОШЕНА В НОЛЬ) -->
      <a-assets>
        <a-asset-item id="church" src="iglesia_de_la_luz_osaka_japon.glb">
        </a-asset-item>
      </a-assets>

      <a-entity gltf-model="#church" position="0 0 0" scale="2 2 2"> </a-entity>

      <!-- ПОЛ ВНУТРИ -->
      <a-plane
        class="nav-mesh clickable"
        rotation="-90 0 0"
        width="8"
        height="16"
        position="0 0 0"
        color="#2a2a2a"
      >
      </a-plane>

      <!-- ВЕРХНИЙ УРОВЕНЬ -->
      <a-plane
        rotation="-90 0 0"
        width="6"
        height="6"
        position="0 5 0"
        color="#3a3a3a"
      >
      </a-plane>

      <!-- UP -->
      <a-cylinder
        class="clickable"
        position="0 0.2 -2"
        radius="0.5"
        height="0.2"
        color="#4CAF50"
        go-to="position: 0 5 0"
      >
        <a-text
          value="UP"
          align="center"
          position="0 0.6 0"
          color="white"
        ></a-text>
      </a-cylinder>

      <!-- DOWN -->
      <a-cylinder
        class="clickable"
        position="0 5.2 0"
        radius="0.5"
        height="0.2"
        color="#e74c3c"
        go-to="position: 0 1.6 2"
      >
        <a-text
          value="DOWN"
          align="center"
          position="0 0.6 0"
          color="white"
        ></a-text>
      </a-cylinder>

      <!-- LIGHT -->
      <a-light type="ambient" intensity="0.3"></a-light>
      <a-light type="directional" position="2 5 3" intensity="1"></a-light>
    </a-scene>
  </body>
</html>
