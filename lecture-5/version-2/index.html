<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Ecology Scene</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- Teleport -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-cursor-teleport@1.6.0/dist/aframe-cursor-teleport-component.min.js"></script>

    <!-- go-to (LOCAL FILE) -->
    <script src="js/go-to.js"></script>
  </head>

  <body>
    <a-scene cursor="rayOrigin: mouse" raycaster="objects: .clickable">
      <!-- CAMERA RIG (Assignment 2: smooth transition added) -->
      <a-entity
        id="cameraRig"
        cursor-teleport="
          cameraRig: #cameraRig;
          cameraHead: #head;
          collisionEntities: .nav-mesh;
          transitionSpeed: 0.01
        "
      >
        <a-entity id="head" camera look-controls position="0 1.6 5"></a-entity>
      </a-entity>

      <!-- FOREST MODEL -->
      <a-assets>
        <a-asset-item id="forest" src="forest.glb"></a-asset-item>
      </a-assets>

      <a-entity
        gltf-model="#forest"
        position="0 0 -10"
        scale="2 2 2"
      ></a-entity>

      <!-- GROUND FLOOR -->
      <a-plane
        class="nav-mesh clickable"
        rotation="-90 0 0"
        width="20"
        height="20"
        color="#2c3e2f"
      >
      </a-plane>

      <!-- LOWER LEVEL (for descending test) -->
      <a-plane
        class="nav-mesh clickable"
        rotation="-90 0 0"
        width="10"
        height="10"
        position="0 -4 -10"
        color="#1f2a22"
      >
      </a-plane>

      <!-- ROOF PLATFORM -->
      <a-plane
        rotation="-90 0 0"
        width="8"
        height="8"
        position="0 8 -10"
        color="#3a4a3f"
      >
      </a-plane>

      <!-- UP BUTTON (Assignment 3 solution) -->
      <a-box
        class="clickable"
        position="2 1 -5"
        color="#4CAF50"
        go-to="position: 0 9 -10"
      >
        <a-text value="UP" align="center" position="0 1 0" color="white">
        </a-text>
      </a-box>

      <!-- DOWN BUTTON -->
      <a-box
        class="clickable"
        position="0 9 -10"
        color="#e74c3c"
        go-to="position: 0 1.6 5"
      >
        <a-text value="DOWN" align="center" position="0 1 0" color="white">
        </a-text>
      </a-box>

      <!-- EXTRA DROP ZONE (Assignment 3: click to fall) -->
      <a-plane
        class="nav-mesh clickable"
        rotation="-90 0 0"
        width="4"
        height="4"
        position="0 4 -10"
        color="#555"
      >
      </a-plane>

      <!-- LIGHTING (cinematic, because you asked for taste) -->
      <a-light type="ambient" intensity="0.3" color="#5c6fa3"></a-light>

      <a-light
        type="directional"
        intensity="1.2"
        position="-5 6 3"
        color="#ffb27a"
      >
      </a-light>

      <a-light
        type="directional"
        intensity="0.4"
        position="5 3 -2"
        color="#6f86ff"
      >
      </a-light>
    </a-scene>
  </body>
</html>
