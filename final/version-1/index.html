<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>EcoMind VR Exhibition</title>

    <!-- AFRAME -->
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

    <!-- TELEPORT -->
    <script src="https://cdn.jsdelivr.net/npm/aframe-blink-controls/dist/aframe-blink-controls.min.js"></script>

    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-cursor-teleport@1.6.0/dist/aframe-cursor-teleport-component.min.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: black;
      }

      canvas {
        outline: none;
      }
    </style>
  </head>

  <body>
    <a-scene
      renderer="
        antialias: true;
        physicallyCorrectLights: true;
        colorManagement: true;
        highRefreshRate: true;
      "
      background="color: #0f1720"
      vr-mode-ui="enabled: true"
      loading-screen="dotsColor: #ffffff; backgroundColor: #000000"
      webxr="
        optionalFeatures:
        local-floor,
        bounded-floor,
        hand-tracking,
        layers;
      "
    >
      <!-- ASSETS -->

      <a-assets timeout="15000">
        <!-- VIDEO -->

        <video
          id="mossVideo"
          src="./Vr21.mp4"
          loop
          muted
          crossorigin="anonymous"
          playsinline
          webkit-playsinline
          preload="metadata"
        ></video>

        <!-- AUDIO -->

        <audio
          id="ambientMusic"
          src="Moss Garden (2017 Remaster).mp3"
          preload="none"
        ></audio>

        <!-- HANDS -->

        <a-asset-item id="leftHandModel" src="leftHandLow.glb"></a-asset-item>

        <a-asset-item id="rightHandModel" src="rightHandLow.glb"></a-asset-item>
      </a-assets>

      <!-- LIGHTING -->

      <a-entity
        light="
          type: ambient;
          intensity: 1.9;
          color: #f6fbff;
        "
      ></a-entity>

      <a-entity
        light="
          type: directional;
          intensity: 2.5;
          color: #ffffff;
        "
        position="0 240 -180"
      ></a-entity>

      <!-- MAIN MOVING LIGHT -->

      <a-light
        id="movingLight"
        type="point"
        color="#dffff4"
        intensity="1.8"
        distance="1200"
        position="0 180 -420"
        animation="
          property: position;
          dir: alternate;
          dur: 26000;
          loop: true;
          to: 0 320 -700
        "
      >
      </a-light>

      <!-- DISTANT ROTATING LIGHT SYSTEM -->

      <a-entity
        position="0 220 -1000"
        animation="
          property: rotation;
          to: 0 360 0;
          dur: 180000;
          loop: true;
        "
      >
        <a-light
          type="point"
          color="#dffff4"
          intensity="2"
          distance="1600"
          position="450 0 0"
        >
        </a-light>

        <a-light
          type="point"
          color="#d9d0ff"
          intensity="1.8"
          distance="1600"
          position="-450 0 0"
        >
        </a-light>
      </a-entity>

      <!-- CAMERA -->

      <a-entity id="cameraRig" position="0 0 0">
        <!-- HEAD -->

        <a-entity
          id="head"
          camera
          position="0 1.6 0"
          look-controls="pointerLockEnabled: true"
        >
        </a-entity>

        <!-- LEFT HAND -->

        <a-entity
          id="leftHand"
          hand-controls="hand: left; handModelStyle: lowPoly"
          laser-controls="hand: left"
          raycaster="objects: .interactive"
          line="color: #ffffff; opacity: 0.7"
          gltf-model="#leftHandModel"
          blink-controls="
            cameraRig: #cameraRig;
            teleportOrigin: #head;
            collisionEntities: .collision;
          "
        >
        </a-entity>

        <!-- RIGHT HAND -->

        <a-entity
          id="rightHand"
          hand-controls="hand: right; handModelStyle: lowPoly"
          laser-controls="hand: right"
          raycaster="objects: .interactive"
          line="color: #ffffff; opacity: 0.7"
          gltf-model="#rightHandModel"
          blink-controls="
            cameraRig: #cameraRig;
            teleportOrigin: #head;
            collisionEntities: .collision;
          "
        >
        </a-entity>
      </a-entity>

      <!-- VIDEO WORLD -->

      <a-videosphere src="#mossVideo" radius="1000" rotation="0 -90 0">
      </a-videosphere>

      <!-- DEPTH ATMOSPHERE -->

      <a-sky color="#16222d" opacity="0.12" radius="1200"> </a-sky>

      <!-- HUGE SPACE PLANES -->

      <a-plane
        position="0 180 -700"
        rotation="-6 0 0"
        width="1800"
        height="900"
        material="
          color: #dffff4;
          opacity: 0.02;
          transparent: true;
          side: double;
        "
        animation="
          property: rotation;
          dir: alternate;
          dur: 50000;
          loop: true;
          to: 4 0 0
        "
      >
      </a-plane>

      <a-plane
        position="-700 260 -1400"
        rotation="0 16 0"
        width="2200"
        height="1200"
        material="
          color: #d9d0ff;
          opacity: 0.015;
          transparent: true;
          side: double;
        "
      >
      </a-plane>

      <a-plane
        position="800 180 -1700"
        rotation="0 -12 0"
        width="2400"
        height="1200"
        material="
          color: #ffffff;
          opacity: 0.01;
          transparent: true;
          side: double;
        "
      >
      </a-plane>

      <!-- HUGE MOVEMENT SPACE -->

      <a-circle
        class="collision"
        rotation="-90 0 0"
        radius="900"
        material="
          opacity: 0;
          transparent: true;
        "
      >
      </a-circle>

      <!-- MASSIVE LIVING TEXT -->

      <a-text
        id="text1"
        class="interactive floatingText"
        value="The room began to breathe without me."
        position="0 42 -140"
        width="230"
        align="center"
        color="#F5F3EE"
        opacity="0.99"
        font="https://cdn.aframe.io/fonts/Aileron-Semibold.fnt"
        animation="
          property: position;
          dir: alternate;
          dur: 9000;
          loop: true;
          to: 0 46 -140
        "
      >
      </a-text>

      <a-text
        id="text2"
        class="interactive floatingText"
        value="Something outside kept calling through the window."
        position="180 36 -300"
        rotation="0 -18 0"
        width="200"
        color="#DDE6D5"
        opacity="0.96"
        font="https://cdn.aframe.io/fonts/Aileron-Semibold.fnt"
        animation="
          property: position;
          dir: alternate;
          dur: 11000;
          loop: true;
          to: 180 42 -300
        "
      >
      </a-text>

      <a-text
        id="text3"
        class="interactive floatingText"
        value="The walls softened first."
        position="-180 32 -260"
        rotation="0 18 0"
        width="170"
        color="#D9D2C5"
        opacity="0.96"
        font="https://cdn.aframe.io/fonts/Aileron-Semibold.fnt"
        animation="
          property: position;
          dir: alternate;
          dur: 8000;
          loop: true;
          to: -180 38 -260
        "
      >
      </a-text>

      <a-text
        id="text4"
        class="interactive floatingText"
        value="I watched the floor remember it was once alive."
        position="0 28 420"
        rotation="0 180 0"
        width="220"
        align="center"
        color="#EFE6D4"
        opacity="0.97"
        font="https://cdn.aframe.io/fonts/Aileron-Semibold.fnt"
        animation="
          property: position;
          dir: alternate;
          dur: 12000;
          loop: true;
          to: 0 34 420
        "
      >
      </a-text>

      <!-- INVISIBLE INTERACTION ZONES -->

      <a-plane
        class="interactive"
        position="0 42 -140"
        width="260"
        height="60"
        material="opacity: 0"
      >
      </a-plane>

      <a-plane
        class="interactive"
        position="180 36 -300"
        rotation="0 -18 0"
        width="240"
        height="60"
        material="opacity: 0"
      >
      </a-plane>

      <a-plane
        class="interactive"
        position="-180 32 -260"
        rotation="0 18 0"
        width="220"
        height="60"
        material="opacity: 0"
      >
      </a-plane>

      <!-- MEMORY ZONES -->

      <a-cylinder
        class="memoryZone interactive"
        position="0 20 -300"
        radius="80"
        height="120"
        visible="false"
      >
      </a-cylinder>

      <a-cylinder
        class="memoryZone interactive"
        position="220 30 -700"
        radius="120"
        height="160"
        visible="false"
      >
      </a-cylinder>

      <a-cylinder
        class="memoryZone interactive"
        position="-260 40 -900"
        radius="140"
        height="180"
        visible="false"
      >
      </a-cylinder>

      <!-- SPATIAL AUDIO -->

      <a-entity
        id="musicEntity"
        sound="
          src: #ambientMusic;
          autoplay: false;
          loop: true;
          positional: false;
          volume: 0.42
        "
      >
      </a-entity>

      <a-entity
        id="whisperZone"
        sound="
          src: #ambientMusic;
          autoplay: false;
          loop: false;
          positional: true;
          volume: 0.18;
          distanceModel: exponential;
          maxDistance: 120;
        "
        position="0 40 -260"
      >
      </a-entity>
    </a-scene>

    <script>
      const startExperience = () => {
        const video = document.querySelector("#mossVideo");

        const music = document.querySelector("#musicEntity");

        if (video.paused) {
          video.play().catch((e) => {
            console.log(e);
          });
        }

        if (music.components.sound) {
          music.components.sound.playSound();
        }
      };

      window.addEventListener("click", startExperience, { once: true });

      window.addEventListener("touchstart", startExperience, { once: true });

      // CAMERA BREATHING

      const rig = document.querySelector("#cameraRig");

      rig.setAttribute(
        "animation__float",
        `
        property: position;
        dir: alternate;
        dur: 6000;
        loop: true;
        to: 0 0.08 0
      `,
      );

      // LIVING INTERACTIONS

      const interactive = document.querySelectorAll(".interactive");

      interactive.forEach((obj) => {
        obj.addEventListener("mouseenter", () => {
          const texts = document.querySelectorAll(".floatingText");

          texts.forEach((text) => {
            text.setAttribute(
              "animation__grow",
              `
              property: scale;
              to: 1.12 1.12 1.12;
              dur: 2200;
            `,
            );

            text.setAttribute(
              "animation__opacity",
              `
              property: opacity;
              to: 1;
              dur: 1800;
            `,
            );
          });

          const light = document.querySelector("#movingLight");

          light.setAttribute(
            "animation__move",
            `
            property: position;
            dur: 6000;
            to: 0 260 -800;
          `,
          );
        });

        obj.addEventListener("mouseleave", () => {
          const texts = document.querySelectorAll(".floatingText");

          texts.forEach((text) => {
            text.setAttribute(
              "animation__shrink",
              `
              property: scale;
              to: 1 1 1;
              dur: 3000;
            `,
            );
          });
        });

        obj.addEventListener("click", () => {
          const scene = document.querySelector("a-scene");

          scene.setAttribute(
            "animation__flash",
            `
            property: background.color;
            from: #0f1720;
            to: #314655;
            dir: alternate;
            dur: 1800;
            loop: 2;
          `,
          );

          const whisper = document.querySelector("#whisperZone");

          if (whisper.components.sound) {
            whisper.components.sound.playSound();
          }

          // subtle pulse

          rig.setAttribute(
            "animation__pulse",
            `
            property: position;
            dir: alternate;
            dur: 900;
            loop: 2;
            to: 0 0.18 0
          `,
          );
        });
      });

      // MEMORY ZONES

      const memoryZones = document.querySelectorAll(".memoryZone");

      memoryZones.forEach((zone) => {
        zone.addEventListener("mouseenter", () => {
          const scene = document.querySelector("a-scene");

          scene.setAttribute(
            "animation__spaceShift",
            `
            property: background.color;
            to: #1c2f3d;
            dur: 5000;
          `,
          );

          const lights = document.querySelectorAll("a-light");

          lights.forEach((light) => {
            light.setAttribute(
              "animation__pulse",
              `
              property: light.intensity;
              dir: alternate;
              dur: 4000;
              loop: 2;
              to: 3
            `,
            );
          });

          const texts = document.querySelectorAll(".floatingText");

          texts.forEach((text) => {
            const randomX = (Math.random() - 0.5) * 40;

            text.setAttribute(
              "animation__drift",
              `
              property: position;
              dur: 12000;
              dir: alternate;
              loop: 1;
              to: ${randomX}
                  ${30 + Math.random() * 20}
                  ${-200 - Math.random() * 400}
            `,
            );
          });
        });
      });

      // VR ENTER

      const scene = document.querySelector("a-scene");

      scene.addEventListener("enter-vr", () => {
        const video = document.querySelector("#mossVideo");

        if (video.paused) {
          video.play();
        }
      });
    </script>
  </body>
</html>
