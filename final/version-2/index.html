<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>EcoMind Spatial VR</title>

    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="go-to.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <a-scene background="color:#000">
      <a-assets>
        <!-- AUDIO -->
        <audio
          id="bgmusic"
          src="Moss Garden (2017 Remaster).mp3"
          preload="auto"
        ></audio>

        <!-- VIDEO -->
        <video
          id="mossVideo"
          src="mossroom2.mp4"
          autoplay
          loop
          muted
          playsinline
          crossorigin="anonymous"
        ></video>

        <!-- BEFORE -->
        <img id="v1b" src="view1_before.jpeg" />
        <img id="v2b" src="view2_before.png" />
        <img id="v3b" src="view3_before.png" />
        <img id="v4b" src="view4_before.png" />
        <img id="v5b" src="view5_before.png" />
        <img id="v6b" src="view6_before.png" />
        <img id="v7b" src="view7_before.png" />
        <img id="v8b" src="view8_before.png" />
        <img id="v9b" src="view9_before.png" />
        <img id="v10b" src="view10_before.png" />
        <img id="v11b" src="view11_before.png" />
        <img id="v12b" src="view12_before.png" />

        <!-- AFTER -->
        <img id="v1a" src="view1_after.png" />
        <img id="v2a" src="view2_after.png" />
        <img id="v3a" src="view3_after.png" />
        <img id="v4a" src="view4_after.png" />
        <img id="v5a" src="view5_after.png" />
        <img id="v6a" src="view6_after.png" />
        <img id="v7a" src="view7_after.png" />
        <img id="v8a" src="view8_after.png" />
        <img id="v9a" src="view9_after.png" />
        <img id="v10a" src="view10_after.png" />
        <img id="v11a" src="view11_after.png" />
        <img id="v12a" src="view12_after.png" />
      </a-assets>

      <!-- CAMERA -->
      <a-entity id="rig" position="0 1.6 0">
        <a-camera>
          <a-cursor fuse="false"></a-cursor>
        </a-camera>
      </a-entity>

      <!-- FADE -->
      <a-plane
        id="fade"
        position="0 1.6 -0.4"
        width="2"
        height="2"
        color="black"
        opacity="0"
        material="shader:flat"
      >
      </a-plane>

      <!-- SKY -->
      <a-sky id="sky" src="#v1b"></a-sky>

      <!-- ENVIRONMENTAL VIDEO LAYER -->
      <a-video
        src="#mossVideo"
        position="0 2.3 -6"
        width="5"
        height="3"
        opacity="0.55"
      >
      </a-video>

      <!-- HOTSPOTS -->
      <a-circle
        class="hotspot"
        position="-2 1 -4"
        radius="0.25"
        color="#88ffcc"
      ></a-circle>
      <a-circle
        class="hotspot"
        position="2 1 -4"
        radius="0.25"
        color="#88ffcc"
      ></a-circle>
      <a-circle
        class="hotspot"
        position="0 0.5 -6"
        radius="0.22"
        color="#88ffcc"
      ></a-circle>
    </a-scene>

    <script>
      const beforeViews = [
        "#v1b",
        "#v2b",
        "#v3b",
        "#v4b",
        "#v5b",
        "#v6b",
        "#v7b",
        "#v8b",
        "#v9b",
        "#v10b",
        "#v11b",
        "#v12b",
      ];

      const afterViews = [
        "#v1a",
        "#v2a",
        "#v3a",
        "#v4a",
        "#v5a",
        "#v6a",
        "#v7a",
        "#v8a",
        "#v9a",
        "#v10a",
        "#v11a",
        "#v12a",
      ];

      const graph = {
        0: [1, 2, 3],
        1: [0, 4, 5],
        2: [0, 6, 7],
        3: [0, 8, 9],
        4: [1, 10],
        5: [1, 11],
        6: [2],
        7: [2],
        8: [3],
        9: [3],
        10: [4],
        11: [5],
      };

      let currentNode = 0;
      let transformed = false;

      const sky = document.querySelector("#sky");
      const fade = document.querySelector("#fade");
      const hotspots = document.querySelectorAll(".hotspot");

      function updateSky() {
        sky.setAttribute(
          "src",
          transformed ? afterViews[currentNode] : beforeViews[currentNode],
        );
      }

      function updateHotspots() {
        const neighbors = graph[currentNode] || [];

        hotspots.forEach((spot, i) => {
          if (neighbors[i] !== undefined) {
            spot.setAttribute("visible", true);
            spot.dataset.target = neighbors[i];

            const positions = ["-2 1 -4", "2 1 -4", "0 0.5 -6"];

            spot.setAttribute("position", positions[i]);
          } else {
            spot.setAttribute("visible", false);
          }
        });
      }

      function goToNode(target) {
        fade.setAttribute("animation", {
          property: "opacity",
          to: 1,
          dur: 250,
        });

        setTimeout(() => {
          currentNode = target;
          updateSky();
          updateHotspots();

          fade.setAttribute("animation", {
            property: "opacity",
            to: 0,
            dur: 250,
          });
        }, 250);
      }

      hotspots.forEach((spot) => {
        spot.addEventListener("click", () => {
          goToNode(parseInt(spot.dataset.target));
        });
      });

      document.addEventListener("keydown", (e) => {
        if (e.code === "Space") {
          transformed = !transformed;
          updateSky();
        }
      });

      document.body.addEventListener(
        "click",
        () => {
          const music = document.querySelector("#bgmusic");
          if (music.paused) music.play();
        },
        { once: true },
      );

      updateSky();
      updateHotspots();
    </script>
  </body>
</html>
